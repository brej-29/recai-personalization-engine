version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - .:/app
    command: ["/app/docker/entrypoint.sh"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recai
    ports:
      - "5432:5432"
    volumes:
      - recai_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  recai_pg_data: