[project]
name = "kindred"
version = "1.0.0"
description = "Cross-media taste engine: recommend across anime, manga, manhwa, movies and series."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
pipeline = [
  "requests>=2.32",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "sentence-transformers>=3.0",
  "pandas>=2.2",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
