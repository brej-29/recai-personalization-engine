[project]
name = "recai-personalization-engine"
version = "0.1.0"
description = "RecAI - Multi-Domain Personalization Engine (MVP)"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = """
/(
    \.git
  | \.venv
  | build
  | dist
  | migrations
)/
"""

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "app/db/migrations",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]